name: Reproduction
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        item:
          # Here you can add your fork of Renode
          - repository: 'https://github.com/renode/renode'
            revision: v1.17.0
            name: renode-stable
          - repository: 'https://github.com/renode/renode'
            revision: master
            name: renode-latest
          # Renode with the fix: renode, renode-infrastructure and tlib forks whose
          # ci/idau-secure branches point at the fix branches named in README.md
          - repository: 'https://github.com/asmellby/renode'
            revision: ci/idau-secure
            name: renode-fixed
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Configure git and artifacts dir
        run: |
          git config --global user.name "Antmicro"
          git config --global user.email "contact@antmicro.com"
      
      - uses: actions/download-artifact@v4
        with:
          name: build-results
          path: artifacts

      - name: Prepare Python dependencies
        run: pip3 install -r requirements.txt

      - name: Run tests on Renode
        # antmicro/renode-test-action@v5 passes --net to build.sh, which Renode master no longer
        # accepts; switch back once the action is fixed upstream
        uses: asmellby/renode-test-action@drop-net-flag
        with:
            renode-repository: ${{ matrix.item.repository }}
            renode-revision: ${{ matrix.item.revision }}
            tests-to-run: 'test.robot'

      - name: Archive Renode simulation results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
            name: test-results-${{ matrix.item.name }}
            path: |
                report.html
                log.html
                robot_output.xml

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Configure git and artifacts dir
        run: |
          git config --global user.name "Antmicro"
          git config --global user.email "contact@antmicro.com"

      - name: Run custom build.sh
        run: ./build.sh

      - name: Archive build results
        uses: actions/upload-artifact@v4
        with:
            name: build-results
            path: |
                artifacts
    
